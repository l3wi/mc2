[package]
name = "mc2-runtime"
description = "NodeRuntime trait and microsandbox SDK backend for MicroCommandControl agents"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
mc2-api = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "macros", "rt"] }
tracing = { workspace = true }
# Official microsandbox Rust SDK (libkrun embed). `ssh` = in-process host SSH serve.
microsandbox = { version = "0.6.8", features = ["ssh"] }
# Policy Rule / Destination types for narrow fabric Host:port allows (D13).
microsandbox-network = "0.6.8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow = { workspace = true }

[[example]]
name = "msb_shell"
required-features = []

[lib]
name = "mc2_runtime"
path = "src/lib.rs"

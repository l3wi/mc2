[package]
name = "mcc-agent"
description = "MicroCommandControl node agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
mcc-api = { workspace = true }
mcc-runtime = { workspace = true }
mcc-metrics = { workspace = true }
anyhow = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing = { workspace = true }
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
http = "1"
num_cpus = "1"
# Same SDK as runtime; ssh feature enabled via mcc-runtime (cargo feature unification).
microsandbox = { version = "0.6.8", features = ["ssh"] }

[lib]
name = "mcc_agent"
path = "src/lib.rs"

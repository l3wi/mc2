[package]
name = "mcc-metrics"
description = "Optional OpenTelemetry OTLP metrics for MicroCommandControl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["metrics", "grpc-tonic", "tls-roots"] }

[lib]
name = "mcc_metrics"
path = "src/lib.rs"

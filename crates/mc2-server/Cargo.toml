[package]
name = "mc2-server"
description = "MicroCommandControl orchestrator (state, REST, scheduler, local node loop)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
mc2-api = { workspace = true }
mc2-store = { workspace = true }
mc2-runtime = { workspace = true }
mc2-metrics = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
hex = "0.4"
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tracing = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures = "0.3"
rand = "0.8"
http = "1"
num_cpus = "1"
# Same SDK as runtime; ssh feature enabled via mc2-runtime (cargo feature unification).
microsandbox = { version = "0.6.8", features = ["ssh"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"

[lib]
name = "mc2_server"
path = "src/lib.rs"

[lints]
workspace = true

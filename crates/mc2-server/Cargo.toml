[package]
name = "mc2-server"
description = "MicroCommandControl server (control plane)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
mc2-api = { workspace = true }
mc2-store = { workspace = true }
mc2-metrics = { workspace = true }
anyhow = { workspace = true }
sha2 = "0.10"
hex = "0.4"
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.8"
http = "1"
tonic = { version = "0.12", features = ["transport", "tls"] }
rcgen = "0.13"
tokio-stream = { version = "0.1", features = ["net"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lib]
name = "mc2_server"
path = "src/lib.rs"

[package]
name = "mc2"
description = "MicroCommandControl — YAML-driven orchestration for microsandbox (server + operator CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "mc2"
path = "src/main.rs"

[dependencies]
mc2-server = { workspace = true }

mc2-api = { workspace = true }
mc2-store = { workspace = true }
mc2-metrics = { workspace = true }
# SecretMeta type for CLI list parsing
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = "0.8"
url = "2"
dialoguer = "0.11"
futures = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

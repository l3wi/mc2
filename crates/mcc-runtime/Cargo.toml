[package]
name = "mcc-runtime"
description = "NodeRuntime trait and microsandbox SDK backend for MicroCommandControl agents"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
mcc-api = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "macros", "rt"] }
tracing = { workspace = true }
# Official microsandbox Rust SDK (libkrun embed) — not the msb CLI.
microsandbox = "0.6.8"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lib]
name = "mcc_runtime"
path = "src/lib.rs"

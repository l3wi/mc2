[package]
name = "mc2-tests"
description = "Integration tests and shared harness for MicroCommandControl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mc2-api = { workspace = true }
mc2-server = { workspace = true }
mc2-store = { workspace = true }
mc2-runtime = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
axum = "0.8"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }


[lib]
name = "mc2_tests"
path = "src/lib.rs"

# Integration test binaries (black-box across crates / process boundaries).
# Unit tests stay next to production code under crates/*/src.

[lints]
workspace = true

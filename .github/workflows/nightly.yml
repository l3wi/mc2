# Nightly prerelease builds from `dev`.
#
# Cuts a `vX.Y.Z-dev.<timestamp>` git tag from `dev`; cargo-dist's `release.yml`
# matches it, builds the binaries, and publishes a GitHub **prerelease**.
# The base version comes from the latest full `vX.Y.Z` release tag, so nightlies
# always track the upcoming release without touching `dev`'s Cargo.toml.
#
# Nightly tags point to commits on throwaway local branches, so they never
# appear in `main`'s history (release-plz ignores them) nor in the changelog
# (`tag_pattern` in release-plz.toml excludes `-dev` tags).
#
# The tag is pushed with a GitHub App installation token, *not* the default
# `GITHUB_TOKEN`: GitHub does not start workflows (including `release.yml`) for
# refs pushed with `GITHUB_TOKEN`, so the nightly tag would never produce a
# prerelease.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_APP_ID           — the GitHub App's numeric App ID
#   RELEASE_APP_PRIVATE_KEY  — the App's PEM private key
# Install the App on this repository with `Contents: Read and write`.
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {}

# Least privilege: the job takes its write scope from the App installation
# token, so the workflow token itself stays read-only.
permissions:
  contents: read

jobs:
  nightly:
    name: Nightly prerelease from dev
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Only what pushing the nightly tag needs.
          permission-contents: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0
          # Credentials are persisted so the `git push` below authenticates as
          # the App (that is what triggers `release.yml`).
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install system deps (microsandbox links libcap-ng on Linux)
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Cut nightly prerelease tag
        run: |
          set -euo pipefail
          # Latest full release version (vX.Y.Z), excluding any -dev tags.
          BASE=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-dev' | head -1 | sed 's/^v//')
          BASE="${BASE:-0.1.0}"
          DATE=$(date -u +%Y%m%d%H%M)
          PRERELEASE="${BASE}-dev.${DATE}"
          git checkout -b "nightly/${PRERELEASE}"
          # Set the workspace version (all crates inherit via version.workspace).
          sed -i.bak "s/^version = \".*\"/version = \"${PRERELEASE}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          # Refresh Cargo.lock for the workspace version change.
          cargo check -p mc2
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): nightly ${PRERELEASE}"
          git tag "v${PRERELEASE}"
          # Push only the tag; the throwaway branch stays local.
          git push origin "v${PRERELEASE}"
          echo "tagged v${PRERELEASE}"

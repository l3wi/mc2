# Nightly prerelease builds from `dev`.
#
# Cuts a `vX.Y.Z-dev.<timestamp>` git tag from `dev`; cargo-dist's `release.yml`
# matches it, builds the binaries, and publishes a GitHub **prerelease**.
# The base version comes from the latest full `vX.Y.Z` release tag, so nightlies
# always track the upcoming release without touching `dev`'s Cargo.toml.
#
# Nightly tags point to commits on throwaway local branches, so they never
# appear in `main`'s history (release-plz ignores them) nor in the changelog
# (`tag_pattern` in release-plz.toml excludes `-dev` tags).
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  nightly:
    name: Nightly prerelease from dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cut nightly prerelease tag
        run: |
          set -euo pipefail
          # Latest full release version (vX.Y.Z), excluding any -dev tags.
          BASE=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-dev' | head -1 | sed 's/^v//')
          BASE="${BASE:-0.1.0}"
          DATE=$(date -u +%Y%m%d%H%M)
          PRERELEASE="${BASE}-dev.${DATE}"
          git checkout -b "nightly/${PRERELEASE}"
          # Set the workspace version (all crates inherit via version.workspace).
          sed -i.bak "s/^version = \".*\"/version = \"${PRERELEASE}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          # Refresh Cargo.lock for the workspace version change.
          cargo check -p mc2
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): nightly ${PRERELEASE}"
          git tag "v${PRERELEASE}"
          # Push only the tag; the throwaway branch stays local.
          git push origin "v${PRERELEASE}"
          echo "tagged v${PRERELEASE}"

# release-plz: auto version bumps + tags on `main`.
#
# - `release-pr` job: opens/updates a release PR that bumps the version and
#   regenerates CHANGELOG.md from conventional commits (feature batches →
#   minor, hotfixes → patch). This PR is merged to release.
# - `release` job: when a release PR merges, creates the `vX.Y.Z` git tag.
#   cargo-dist's `release.yml` then builds installers and publishes the
#   GitHub Release.
name: Release-plz

on:
  push:
    branches: [main]

jobs:
  release:
    name: Tag merged release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release

  release-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    # Job-level permissions: creating the release PR needs pull-requests: write.
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr

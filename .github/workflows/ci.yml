name: ci

on:
  push:
    branches: [main, dev, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Least privilege by default; the `security` job opts in to `checks: write`
# for the check runs posted by cargo-audit.
permissions:
  contents: read

jobs:
  rust:
    name: fmt · clippy · test · doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system deps (microsandbox links libcap-ng on Linux)
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Docs (rustdoc warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

      - name: Unused dependencies
        run: |
          cargo install cargo-machete --locked
          cargo machete

      - name: Build mc2 binary
        run: cargo build -p mc2

  # License + advisory gates (blocking). Documented exceptions live in
  # deny.toml and .cargo/audit.toml; add there, not by weakening the gate.
  security:
    name: licenses · advisories
    runs-on: ubuntu-latest
    # cargo-audit posts a check run; needs checks: write. `contents: read` is
    # spelled out because a job-level `permissions` block sets every scope it
    # does not list to `none` (checkout needs contents).
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo-deny (licenses / advisories / bans / sources)
        uses: embarkstudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all

      - name: cargo-audit (advisories)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

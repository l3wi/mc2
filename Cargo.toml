[workspace]
resolver = "2"
members = [
    "crates/mc2",
    "crates/mc2-server",
    "crates/mc2-api",
    "crates/mc2-store",
    "crates/mc2-runtime",
    "crates/mc2-metrics",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/placeholder/mc2"
authors = ["MC2 contributors"]
# microsandbox 0.6.x / smoltcp need a recent stable (1.91+).
rust-version = "1.91"

[workspace.dependencies]
mc2-api = { path = "crates/mc2-api" }
mc2-store = { path = "crates/mc2-store" }
mc2-server = { path = "crates/mc2-server" }

mc2-runtime = { path = "crates/mc2-runtime" }
mc2-metrics = { path = "crates/mc2-metrics" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true

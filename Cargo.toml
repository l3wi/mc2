[workspace]
resolver = "2"
members = [
    "crates/mc2",
    "crates/mc2-server",
    "crates/mc2-api",
    "crates/mc2-store",
    "crates/mc2-runtime",
    "crates/mc2-metrics",
    "tests",
]

[workspace.package]
version = "0.1.0-dev.202608300739"
edition = "2021"
license = "MIT"
repository = "https://github.com/l3wi/mc2"
authors = ["MC2 contributors"]
# microsandbox 0.6.x / smoltcp need a recent stable (1.91+).
rust-version = "1.91"

[workspace.dependencies]
mc2-api = { path = "crates/mc2-api" }
mc2-store = { path = "crates/mc2-store" }
mc2-server = { path = "crates/mc2-server" }

mc2-runtime = { path = "crates/mc2-runtime" }
mc2-metrics = { path = "crates/mc2-metrics" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Workspace-wide lints. MC2 has a zero-`unsafe` posture; enforce it at the
# crate level so new `unsafe` blocks fail the build.
[workspace.lints.rust]
unsafe_code = "deny"


[profile.release]
lto = true
codegen-units = 1
strip = true


# Distribution via `dist` (cargo-dist): `dist generate` writes the release CI;
# `dist plan --tag=vX.Y.Z` previews a release. Installer: shell script.
[workspace.metadata.dist]
dist = true
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
# Release notes from CHANGELOG.md sections.
changelog = true
# The generated release.yml is hand-tuned (installs libcap-ng-dev for the
# Linux microsandbox link); allow cargo-dist to accept the drift.
allow-dirty = ["ci"]
# cargo-dist release builds use the `dist` profile (release + LTO/strip).
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true

[workspace]
resolver = "2"
members = [
    "crates/mcc",
    "crates/mcc-server",
    "crates/mcc-agent",
    "crates/mcc-api",
    "crates/mcc-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/placeholder/mcc"
authors = ["MCC contributors"]
rust-version = "1.80"

[workspace.dependencies]
mcc-api = { path = "crates/mcc-api" }
mcc-store = { path = "crates/mcc-store" }
mcc-server = { path = "crates/mcc-server" }
mcc-agent = { path = "crates/mcc-agent" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true

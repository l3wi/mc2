# Secrets smoke stack — set the secret first, then apply.
#
#   mc2 secret set SMOKE_TOKEN --value 'lab-only-token'
#   mc2 up -f examples/02-secrets/stack.yaml
#
# Guest env shows a placeholder ($MSB_<env>); the proxy adds the real value to
# HTTP headers of TLS requests to allowHosts only. CI covers set → apply →
# desired-set injection in tests/tests/secrets.rs (no hypervisor).
name: smoke-secrets

services:
  keep:
    image: alpine:3.20
    scale: 1
    cpus: 1
    mem_limit: 128m
    network:
      profiles: [public]
    secrets:
      - name: SMOKE_TOKEN
        env: API_TOKEN
        allowHosts:
          # Lab: replace with a host you can curl from the guest, or keep for inject-only smoke.
          - api.example.com
    restart: on-failure
    command: ["sleep", "infinity"]
    labels:
      app: smoke-secrets

name: ssh-ingress
services:
  web:
    image: alpine:3.20
    cpus: 1
    mem_limit: 128m
    command: ["sleep", "infinity"]
    ssh:
      enabled: true
      bind: 127.0.0.1
      port: 2222
      authorizedKeys: [developer]
ingress:
  tcp:
    - name: web-ssh
      entryPoint: ssh
      service: web

# Persistent volumes example — one named directory volume mounted by a service.
#
#   mc2 up -f examples/06-persistent-volumes/stack.yaml
#
# The volume `data` is backed by a named directory volume on the node
# (default ~/.microsandbox/volumes, override with `mc2 server --volume-dir`).
# Data survives sandbox recreate/restart and stack removal. CI covers
# apply → desired-set mount material in tests/tests/volumes.rs (no hypervisor).
name: smoke-volumes

volumes:
  data:
    kind: dir

services:
  keep:
    image: alpine:3.20
    scale: 1
    cpus: 1
    mem_limit: 128m
    network:
      profiles: [public]
    volumes:
      - name: data
        target: /data
    restart: on-failure
    command: ["sleep", "infinity"]
    labels:
      app: smoke-volumes

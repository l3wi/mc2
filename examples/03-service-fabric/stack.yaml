# Same-node mediated fabric (D13): echo server + client via echo.smoke-fabric.svc.mc2 DNS.
#
#   mc2 up -f examples/03-service-fabric/stack.yaml
#
# After both Running: from the `client` sandbox,
#   wget -qO- http://echo.smoke-fabric.svc.mc2:8080/
# should hit the `echo` service through the server's L4 splice.
#
# Full-mesh fabric: `echo` exposes port 8080, so `client` reaches it by default
# (Docker-style default allow within the stack) — no allow edges needed.
name: smoke-fabric

networks:
  backend:
    mode: mediated

services:
  echo:
    # python image: alpine micro rootfs may lack busybox httpd applet.
    image: python:3.12-alpine
    scale: 1
    cpus: 1
    mem_limit: 256m
    network:
      profiles: [public]
    expose:
      - port: 8080
        protocol: tcp
    command:
      - /bin/sh
      - -c
      - "mkdir -p /tmp/www && printf 'FABRIC_OK\\n' > /tmp/www/index.html && cd /tmp/www && exec python -m http.server 8080"
    restart: always
    labels:
      app: smoke-fabric-echo

  client:
    image: alpine:3.20
    scale: 1
    cpus: 1
    mem_limit: 128m
    network:
      profiles: [public]
    command: ["sleep", "infinity"]
    restart: always
    labels:
      app: smoke-fabric-client

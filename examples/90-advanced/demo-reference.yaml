# Example stack for MicroCommandControl (small alpine image for quick pulls).
# Apply: mc2 apply -f examples/advanced/demo-reference.yaml --token <api-token>
#
# alpine's busybox httpd serves files from / (demo page is the filesystem listing).
apiVersion: mc2/v1
kind: Stack
metadata:
  name: demo
  labels:
    env: lab

services:
  web:
    image: alpine:3.20
    replicas: 1
    resources:
      cpus: 1
      memoryMiB: 128
    ports:
      - host: 8080
        guest: 8000
        protocol: tcp
        # bind defaults to 127.0.0.1
    network:
      profiles: [public]
    env:
      APP_ENV: lab
    # Cluster secrets (set with `mc2 secret set NAME --value …`), then reference:
    # secrets:
    #   - name: GITHUB_TOKEN
    #     env: GITHUB_TOKEN
    #     allowHosts:
    #       - api.github.com
    restartPolicy: on-failure
    # Optional app probe (agent runs via msb exec while Running):
    # health:
    #   kind: exec
    #   command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/"]
    #   intervalSeconds: 30
    command: ["httpd", "-f", "-p", "8000", "-h", "/"]
    labels:
      app: web

# volumes: {}
# Optional north–south HTTP via BYO Traefik (server --ingress-config-dir):
# ingress:
#   tls:
#     enabled: true
#   rules:
#     - host: demo.local
#       paths:
#         - path: /
#           service: web
#           port: 8000

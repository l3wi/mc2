# Fast smoke stack — small OCI image (alpine ~3–4 MB compressed).
# Apply: mc2 apply -f examples/stacks/smoke.yaml --token <api-token>
#
# Secrets smoke (lab):
#   mc2 secret set SMOKE_TOKEN --value 'lab-only-token'
#   mc2 apply -f examples/stacks/smoke-secrets.yaml
apiVersion: mc2/v1
kind: Stack
metadata:
  name: smoke
  labels:
    env: lab
    purpose: smoke

services:
  keep:
    image: alpine:3.20
    replicas: 1
    resources:
      cpus: 1
      memoryMiB: 128
    network:
      profiles: [public]
    restartPolicy: on-failure
    # Keep the microVM up without pulling a large language runtime.
    command: ["sleep", "infinity"]
    labels:
      app: smoke


# Secrets smoke stack — set the cluster secret first, then apply.
#
#   mcc secret set SMOKE_TOKEN --value 'lab-only-token'
#   mcc apply -f examples/stacks/smoke-secrets.yaml
#
# Guest env shows a placeholder (msb host-side injection); the real value is
# only attached on TLS to allowHosts. CI covers set → apply → agent Sync
# material in tests/tests/secrets.rs (no hypervisor).
apiVersion: mcc/v1
kind: Stack
metadata:
  name: smoke-secrets
  labels:
    env: lab
    purpose: secrets-smoke

services:
  keep:
    image: alpine:3.20
    replicas: 1
    resources:
      cpus: 1
      memoryMiB: 128
    network:
      profiles: [public]
    secrets:
      - name: SMOKE_TOKEN
        env: API_TOKEN
        allowHosts:
          # Lab: replace with a host you can curl from the guest, or keep for inject-only smoke.
          - api.example.com
    restartPolicy: on-failure
    command: ["sleep", "infinity"]
    labels:
      app: smoke-secrets

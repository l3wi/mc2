# Same-node mediated fabric (D13): echo server + client via db.shop.svc.mcc DNS.
#
#   mcc apply -f examples/stacks/smoke-fabric.yaml
#
# After both Running: from the `client` sandbox (or via mcc exec when available),
#   wget -qO- http://echo.smoke-fabric.svc.mcc:8080/
# should hit the `echo` service through the agent L4 splice.
apiVersion: mcc/v1
kind: Stack
metadata:
  name: smoke-fabric
  labels:
    env: lab
    purpose: fabric-smoke

networks:
  backend:
    mode: mediated

services:
  echo:
    # python image: alpine micro rootfs may lack busybox httpd applet.
    image: python:3.12-alpine
    replicas: 1
    resources:
      cpus: 1
      memoryMiB: 256
    network:
      profiles: [public]
    expose:
      - port: 8080
        protocol: tcp
    command:
      - /bin/sh
      - -c
      - "mkdir -p /tmp/www && printf 'FABRIC_OK\\n' > /tmp/www/index.html && cd /tmp/www && exec python -m http.server 8080"
    restartPolicy: always
    labels:
      app: smoke-fabric-echo

  client:
    image: alpine:3.20
    replicas: 1
    resources:
      cpus: 1
      memoryMiB: 128
    network:
      profiles: [public]
    allow:
      - to: echo
        port: 8080
        protocol: tcp
    command: ["sleep", "infinity"]
    restartPolicy: always
    labels:
      app: smoke-fabric-client

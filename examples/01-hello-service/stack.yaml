# Hello world — the minimal stack file.
#
#   mc2 up -f examples/01-hello-service/stack.yaml
#
# The stack `name:` is optional: `mc2 up` fills it in
# (defaults to the file stem). See site/content/references/stack/overview.mdx.
services:
  web:
    image: python:3.12-alpine
    ports:
      - "18091:8000"
    command: ["/bin/sh", "-c", "mkdir -p /tmp/www && echo 'hello world' > /tmp/www/index.html && cd /tmp/www && exec python -m http.server 8000"]

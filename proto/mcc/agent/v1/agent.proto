// MicroCommandControl agent API (gRPC).
// Phase 2: implemented with tonic/prost.
syntax = "proto3";

package mcc.agent.v1;

// Agent control-plane service. Agents call these RPCs against the server.
service AgentService {
  // Register a node with a join token; returns node credentials.
  rpc Join(JoinRequest) returns (JoinResponse);

  // Periodic capacity + health report.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Pull desired instance specs for this node (Phase 3+).
  rpc Sync(SyncRequest) returns (SyncResponse);

  // Report instance phase / errors / resource summary (Phase 3+).
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
}

message JoinRequest {
  string join_token = 1;
  string node_name = 2;
  map<string, string> labels = 3;
  string arch = 4;
  Capacity capacity = 5;
}

message JoinResponse {
  string node_id = 1;
  // Long-lived node token for Heartbeat/Sync (v1; mTLS later).
  string node_token = 2;
}

message HeartbeatRequest {
  string node_id = 1;
  string node_token = 2;
  Capacity capacity = 3;
  string status = 4; // Ready | NotReady | Draining
}

message HeartbeatResponse {
  bool ok = 1;
}

message SyncRequest {
  string node_id = 1;
  string node_token = 2;
}

message SyncResponse {
  repeated DesiredInstance instances = 1;
}

message ReportStatusRequest {
  string node_id = 1;
  string node_token = 2;
  repeated InstanceStatus instances = 3;
}

message ReportStatusResponse {
  bool ok = 1;
}

message Capacity {
  uint32 cpus = 1;
  uint64 memory_mib = 2;
}

message DesiredInstance {
  string instance_id = 1;
  string stack = 2;
  string service = 3;
  uint32 ordinal = 4;
  // Opaque JSON/YAML service spec until typed messages land
  string spec_json = 5;
  // Resolved secret injection material (plaintext values; gRPC only to owning agent).
  repeated SecretInjection secrets = 6;
  // Host-side SSH serve desired state (resolved public keys).
  SshDesired ssh = 7;
}

// Host-side msb secret injection: guest sees placeholder; value for allowlisted hosts.
message SecretInjection {
  string env = 1;
  string value = 2;
  repeated string allow_hosts = 3;
}

// Host-side SSH front end (not guest sshd).
message SshDesired {
  bool enabled = 1;
  string bind = 2;
  uint32 port = 3; // 0 = auto
  string user = 4;
  bool sftp = 5;
  repeated string authorized_public_keys = 6;
  string config_hash = 7;
}

message InstanceStatus {
  string instance_id = 1;
  string phase = 2; // Pending | Scheduled | Creating | Running | Failed | Stopped
  string message = 3;
  string runtime_id = 4;
  SshObserved ssh = 5;
}

message SshObserved {
  string phase = 1; // Closed | Opening | Open | Failed
  string bind = 2;
  uint32 port = 3;
  string message = 4;
}
